name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install build tools
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake g++ libboost-all-dev
      
    - name: Build with CMake
      run: |
        rm -rf build
        mkdir build
        cd build
        cmake ..
        make
        rm -rf build