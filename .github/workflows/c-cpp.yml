name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install build tools
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake g++ libboost-all-dev
      
    - name: Build with CMake
      run: |
        mkdir build
        cd build
        cmake ..
        make

    - name: Verify build
      run: |
        cd build
        ls -la
        ./main 2>&1 | head -2 || echo "Build successful"